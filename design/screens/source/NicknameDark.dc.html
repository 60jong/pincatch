<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch pin · 닉네임 · 다크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{margin:0;background:#11141D}
a{color:#EEF1F8;text-decoration:none}a:hover{color:#EEF1F8}
input::placeholder{color:#7C8399}

</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; background: #1B2030; font-family: 'Gothic A1', system-ui, sans-serif; color: #EEF1F8; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin: -6px -10px 0"><a href="PermNotifyDark.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5F667C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="font-size: 17px; font-weight: 900"></div><div style="min-width: 44px; display: flex; justify-content: flex-end"></div></div>
<div aria-label="5단계 중 4단계" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px"><div style="height: 8px; border-radius: 4px; background: #2F6FE8"></div><div style="height: 8px; border-radius: 4px; background: #2F6FE8"></div><div style="height: 8px; border-radius: 4px; background: #2F6FE8"></div><div style="height: 8px; border-radius: 4px; background: #2F6FE8"></div><div style="height: 8px; border-radius: 4px; background: #2A3044"></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1.3">어떻게 불러드릴까요?</h1><div style="font-size: 15px; color: #A3A9BD; font-weight: 700; line-height: 1.5">나중에 내 정보에서 언제든 바꿀 수 있어요</div></div>
<div style="background: #1B2030; border: 2px solid #2A3044; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 54px; box-shadow: 0 0 0 {{ ring }}">
<input type="text" value="{{ nick }}" onChange="{{ onNick }}" maxlength="12" placeholder="닉네임" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #EEF1F8">
<span style="font-size: 15px; color: #7C8399; font-variant-numeric: tabular-nums">{{ count }}/12</span>
</div>
<div style="font-size: 13px; color: {{ helpColor }}; padding: 0 16px; margin-top: -10px">{{ help }}</div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="font-size: 13px; color: #A3A9BD; padding: 0 16px">이런 이름은 어때요?</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; padding: 0 4px"><div role="button" onClick="{{ s0 }}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #1B2030; display: flex; align-items: center; font-size: 15px; cursor: pointer">빠른손가락</div><div role="button" onClick="{{ s1 }}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #1B2030; display: flex; align-items: center; font-size: 15px; cursor: pointer">번개탭</div><div role="button" onClick="{{ s2 }}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #1B2030; display: flex; align-items: center; font-size: 15px; cursor: pointer">핀사냥꾼</div></div></div>
<div style="margin-top: auto">
<sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}"><a href="SignupPhoneDark.dc.html" style="min-height: 54px; border-radius: 16px; box-sizing: border-box; background: #2F6FE8; box-shadow: 0 4px 0 #1D52B8; color: #FFFFFF; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px">다음</a></sc-if>
<sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}"><div aria-disabled="true" style="min-height: 54px; border-radius: 16px; box-sizing: border-box; background: #2A3044; box-shadow: 0 4px 0 #20263A; color: #7C8399; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px">다음</div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const nick = s.nick ?? '';
    const len = Array.from(nick).length;
    const bad = /[^0-9A-Za-z가-힣]/.test(nick);
    let help = '한글, 영문, 숫자로 2~12자';
    let helpColor = '#A3A9BD';
    let ring = '0 transparent';
    let ok = false;
    if (len > 0) {
      if (len < 2) { help = '2자 이상 입력해 주세요'; helpColor = '#FF7A70'; ring = '2px #E8534A'; }
      else if (bad) { help = '특수문자와 띄어쓰기는 쓸 수 없어요'; helpColor = '#FF7A70'; ring = '2px #E8534A'; }
      else { help = '사용할 수 있는 닉네임이에요'; helpColor = '#4FD07D'; ring = '2px #3FBF6B'; ok = true; }
    }
    const sugg = ['빠른손가락', '번개탭', '핀사냥꾼'];
    const out = { nick: nick, count: len, help: help, helpColor: helpColor, ring: ring, ok: ok, notOk: !ok, onNick: (e) => this.setState({ nick: e.target.value }) };
    sugg.forEach((t, i) => { out['s' + i] = () => this.setState({ nick: t }); });
    return out;
  }
}
</script>
</body>
</html>
