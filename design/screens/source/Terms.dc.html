<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const keys = ['tos', 'priv', 'loc', 'age', 'mkt'];
    const req = ['tos', 'priv', 'loc', 'age'];
    const on = (k) => !!s[k];
    const all = keys.every(on);
    const out = {};
    const paint = (k, v) => {
      out[k + 'B'] = v ? 'none' : '1.5px solid #C7C7CC';
      out[k + 'Bg'] = v ? '#2F6FE8' : '#FFFFFF';
      out[k + 'Aria'] = v ? 'true' : 'false';
    };
    keys.forEach((k) => { paint(k, on(k)); out[k + 'Toggle'] = () => this.setState({ [k]: !on(k) }); });
    paint('all', all);
    out.allToggle = () => { const n = {}; keys.forEach((k) => { n[k] = !all; }); this.setState(n); };
    out.ok = req.every(on);
    out.notOk = !out.ok;
    return out;
  }
}
</script>
