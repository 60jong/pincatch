<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch pin · 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F2233;text-decoration:none}a:hover{color:#1F2233}
.scroll-col>*{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; background: #FFFFFF; font-family: 'Gothic A1', system-ui, sans-serif; color: #1F2233">
<div class="scroll-col" style="position: absolute; inset: 0 0 88px 0; overflow-y: auto; padding: 18px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 4px 6px 0; font-size: 28px; font-weight: 900; letter-spacing: -1px">기록</h1>
<div role="tablist" style="background: #F4F6FB; border: 2px solid #E3E7EF; border-radius: 14px; padding: 3px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
<div role="tab" aria-selected="{{ p.sel }}" onClick="{{ p.pick }}" style="min-height: 34px; border-radius: 10px; background: {{ p.bg }}; box-shadow: {{ p.sh }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: {{ p.fw }}; cursor: pointer">{{ p.label }}</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #5B6078">모은 포인트</div>
<div style="font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums">+{{ pts }}<span style="font-size: 20px; color: #5B6078; font-weight: 700"> P</span></div>
</div>
<div style="font-size: 13px; font-weight: 600; color: #1F8A3E; background: rgba(52,199,89,0.14); border-radius: 999px; padding: 4px 10px">성공률 {{ rate }}</div>
</div>
<div style="display: flex; align-items: flex-end; gap: 8px; height: 72px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="7">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 100%; height: {{ b.h }}px; border-radius: 6px; background: {{ b.c }}"></div>
<div style="font-size: 11px; font-weight: 500; color: #5B6078">{{ b.l }}</div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid #E3E7EF; padding-top: 14px">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #3FBF6B"></div><div style="font-size: 14px; color: #5B6078">잡은 핀</div><div style="font-size: 15px; font-weight: 700">{{ won }}</div></div>
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #E8534A"></div><div style="font-size: 14px; color: #5B6078">놓친 핀</div><div style="font-size: 15px; font-weight: 700">{{ lost }}</div></div>
</div>
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div style="font-size: 13px; font-weight: 900; color: #5B6078; padding: 0 6px; margin-bottom: -10px">{{ g.label }}</div>
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; overflow: hidden">
<sc-for list="{{ g.items }}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: {{ r.sep }}">
<div style="width: 32px; height: 32px; border-radius: 50%; background: {{ r.dot }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{ r.win }}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{ r.lose }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 15px; font-weight: 900">{{ r.title }}</div>
<div style="font-size: 13px; color: #5B6078">{{ r.sub }}</div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0">
<div style="font-size: 15px; font-weight: 700; color: {{ r.pc }}; font-variant-numeric: tabular-nums">{{ r.pts }}</div>
<div style="font-size: 12px; color: #5B6078">{{ r.time }}</div>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 2px solid #E3E7EF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px; box-sizing: border-box; z-index: 5"><a href="HomeGlass.dc.html" aria-label="지도" style="display: flex; justify-content: center; align-items: center; min-height: 48px"><div style="width: 60px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7.5-6.5-7.5-12.5a7.5 7.5 0 0 1 15 0C19.5 15.5 12 22 12 22z" fill="#2F6FE8"></path><circle cx="12" cy="9.5" r="3" fill="#FFFFFF"></circle></svg></div></a><a href="History.dc.html" aria-current="page" aria-label="기록" style="display: flex; justify-content: center; align-items: center; min-height: 48px"><div style="width: 60px; height: 44px; border-radius: 14px; border: 2px solid #2F6FE8; background: #E6EEFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v6a6 6 0 0 1-12 0z" fill="#FFC21A"></path><rect x="10" y="14" width="4" height="4" fill="#D99A00"></rect><rect x="6" y="18" width="12" height="3" rx="1.5" fill="#D99A00"></rect></svg></div></a><a href="Wallet.dc.html" aria-label="지갑" style="display: flex; justify-content: center; align-items: center; min-height: 48px"><div style="width: 60px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="4" fill="#2E9E55"></rect><rect x="2" y="5" width="20" height="14" rx="4" fill="#3FBF6B"></rect><circle cx="16.5" cy="12" r="2" fill="#FFFFFF"></circle></svg></div></a><a href="MyPage.dc.html" aria-label="내 정보" style="display: flex; justify-content: center; align-items: center; min-height: 48px"><div style="width: 60px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5" fill="#2E90FA"></circle><path d="M3 21a9 9 0 0 1 18 0z" fill="#2E90FA"></path></svg></div></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const per = s.per || 'week';
    const data = {
      today: { pts: '130', rate: '75%', won: 3, lost: 1, bars: [0, 0, 0, 0, 0, 0, 130], labels: ['', '', '', '', '', '', '오늘'] },
      week: { pts: '640', rate: '71%', won: 12, lost: 5, bars: [60, 110, 30, 150, 90, 70, 130], labels: ['목', '금', '토', '일', '월', '화', '오늘'] },
      month: { pts: '3,210', rate: '68%', won: 42, lost: 20, bars: [420, 610, 780, 900, 500, 0, 0], labels: ['1주', '2주', '3주', '4주', '5주', '', ''] }
    }[per];
    const max = Math.max.apply(null, data.bars) || 1;
    const bars = data.bars.map((v, i) => ({ h: Math.max(4, Math.round((v / max) * 52)), c: v ? (i === data.bars.length - 1 && per !== 'month' ? '#2F6FE8' : 'rgba(47,111,232,0.3)') : '#EEF1F6', l: data.labels[i] }));
    const periods = [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달']].map((p) => {
      const on = p[0] === per;
      return { label: p[1], sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', sh: on ? '0 3px 0 #E3E7EF' : 'none', fw: on ? 900 : 700, pick: () => this.setState({ per: p[0] }) };
    });
    const rows = [
      ['오늘', true, '30P 핀', '0.4초 먼저 · 120m', '+30', '14:02'],
      ['오늘', false, '50P 핀', '0.3초 차이로 놓침', '+0', '13:58'],
      ['오늘', true, '100P 골드 핀', '초접전 · 0.01초 먼저', '+100', '11:20'],
      ['어제', true, '20P 핀', '0.2초 먼저 · 80m', '+20', '21:40'],
      ['어제', true, '10P 핀', '0.6초 먼저 · 210m', '+10', '18:12'],
      ['어제', false, '30P 핀', '0.1초 차이로 놓침', '+0', '09:05']
    ];
    const groups = ['오늘', '어제'].map((g) => {
      const list = rows.filter((r) => r[0] === g);
      return { label: g, items: list.map((r, i) => ({ win: r[1], lose: !r[1], dot: r[1] ? '#3FBF6B' : '#E8534A', title: r[2], sub: r[3], pts: r[4] + 'P', pc: r[1] ? '#1F8A3E' : '#8C93A8', time: r[5], sep: i === list.length - 1 ? 'none' : '2px solid #E3E7EF' })) };
    });
    return { periods: periods, pts: data.pts, rate: data.rate, won: data.won, lost: data.lost, bars: bars, groups: groups };
  }
}
</script>
</body>
</html>
