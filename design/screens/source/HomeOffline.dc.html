<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","default":"cobalt","options":["cobalt","teal","coral","ink"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { if (this.iv) clearInterval(this.iv); }
  tap(i) {
    const s = this.state || {};
    const hidden = Object.assign({}, s.hidden || {});
    if (hidden[i]) return;
    const now = Date.now();
    const tickets = s.tickets ?? 3;
    this.seq = (this.seq || 0) + 1;
    const toasts = s.toasts || [];
    if (tickets <= 0) {
      this.setState({ toasts: [{ id: this.seq, kind: 'empty', born: now }].concat(toasts).slice(0, 3), now: now });
      this.run();
      return;
    }
    const pins = [30, 50, 10, 20, 100];
    const win = i !== 1 && this.seq % 4 !== 0;
    const gaps = ['0.2', '0.3', '0.4', '0.6'];
    const t = { id: this.seq, kind: win ? 'win' : 'lose', pts: pins[i], gap: gaps[this.seq % 4], born: now };
    hidden[i] = true;
    const next = { toasts: [t].concat(toasts).slice(0, 3), hidden: hidden, now: now };
    if (win) {
      next.ptsFrom = this.pointsAt(now);
      next.ptsTo = (s.ptsTo ?? 12480) + pins[i];
      next.ptsBorn = now;
      next.gain = pins[i];
      next.tickets = tickets - 1;
    }
    this.setState(next);
    setTimeout(() => {
      const h = Object.assign({}, (this.state || {}).hidden || {});
      delete h[i];
      this.setState({ hidden: h });
    }, 3200);
    this.run();
  }
  run() { if (!this.iv) this.iv = setInterval(() => this.tick(), 40); }
  pointsAt(now) {
    const s = this.state || {};
    if (!s.ptsBorn) return s.ptsTo ?? 12480;
    const p = Math.min(1, (now - s.ptsBorn) / 700);
    return Math.round(s.ptsFrom + (s.ptsTo - s.ptsFrom) * (1 - Math.pow(1 - p, 3)));
  }
  tick() {
    const now = Date.now();
    const toasts = ((this.state || {}).toasts || []).filter((t) => now - t.born < 2200);
    this.setState({ toasts: toasts, now: now });
    if (!toasts.length) { clearInterval(this.iv); this.iv = null; }
  }
  close(id) { this.setState({ toasts: ((this.state || {}).toasts || []).filter((t) => t.id !== id) }); }
  renderVals() {
    const themes = {
      cobalt: ['#2F6FE8', '#1D52B8', '#E6EEFF', '47,111,232'],
      teal: ['#0E9E88', '#087563', '#E0F6F2', '14,158,136'],
      coral: ['#F0533A', '#C23A24', '#FFEAE5', '240,83,58'],
      ink: ['#1F2233', '#000000', '#ECEEF3', '31,34,51']
    };
    const th = themes[this.props.accent ?? 'cobalt'] || themes.cobalt;
    const s = this.state || {};
    const now = s.now || Date.now();
    const hidden = s.hidden || {};
    const toasts = (s.toasts || []).map((t) => {
      const age = Math.max(0, now - t.born);
      const e = 1 - Math.pow(1 - Math.min(1, age / 220), 3);
      const x = Math.max(0, (age - 2000) / 200);
      const win = t.kind === 'win';
      const empty = t.kind === 'empty';
      return {
        win: win, lose: !win,
        title: win ? '+' + t.pts + 'P 획득!' : empty ? '탭권을 다 썼어요' : '앗, 한 발 늦었어요',
        sub: win ? t.gap + '초 먼저 잡았어요' : empty ? '위의 탭권 버튼에서 충전할 수 있어요' : t.gap + '초 차이 · 탭권은 돌려드렸어요',
        chip: win ? '+' + t.pts + 'P' : empty ? '0/5' : '+0P',
        chipBg: win ? '#FFFFFF' : 'rgba(255,255,255,0.22)',
        chipColor: win ? '#2E9E55' : '#FFFFFF',
        bg: win ? '#3FBF6B' : empty ? '#8C93A8' : '#E8534A',
        edge: win ? '#2E9E55' : empty ? '#6B7289' : '#B33B33',
        aria: (win ? t.pts + '포인트 획득' : empty ? '탭권 없음' : '핀을 놓쳤어요') + ', 탭하면 닫혀요',
        op: (e * (1 - x)).toFixed(3),
        ty: ((1 - e) * -18).toFixed(1),
        sc: (0.96 + 0.04 * e).toFixed(3),
        pw: Math.max(0, 100 - (age / 2200) * 100).toFixed(1),
        close: () => this.close(t.id)
      };
    });
    const gAge = s.ptsBorn ? now - s.ptsBorn : 99999;
    const open = !s.collapsed;
    const out = {
      accent: th[0], accentDark: th[1], accentSoft: th[2], accentRgb: th[3],
      toasts: toasts,
      pointsText: this.pointsAt(now).toLocaleString('en-US'),
      tickets: s.tickets ?? 3,
      gainText: '+' + (s.gain || 0) + 'P',
      gainOp: Math.max(0, Math.min(1, gAge / 200) * (1 - Math.max(0, (gAge - 700) / 400))).toFixed(3),
      gainTy: (6 - gAge / 60).toFixed(1),
      sheetOpen: open,
      sheetAria: open ? '하단 패널 접기' : '하단 패널 펼치기',
      toggleSheet: () => this.setState({ collapsed: open })
    };
    for (let i = 0; i < 5; i++) {
      out['tap' + i] = () => this.tap(i);
      out['pinDisp' + i] = hidden[i] ? 'none' : 'block';
    }
    return out;
  }
}
</script>
