<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'usable';
    const tabs = [['usable', '사용 가능 2'], ['used', '사용 완료']].map((t) => {
      const on = t[0] === tab;
      return { label: t[1], sel: on ? 'true' : 'false', bg: on ? '#2A3044' : 'transparent', sh: on ? '0 3px 0 #2A3044' : 'none', color: on ? '#EEF1F8' : '#A3A9BD', pick: () => this.setState({ tab: t[0] }) };
    });
    const info = [['편의점 상품권', '5,000원'], ['카페 음료 쿠폰', '아메리카노'], ['간편결제 포인트', '1,000원'], ['편의점 상품권', '5,000원']];
    const cur = info[s.open ?? 0];
    const out = { tabs: tabs, usable: tab === 'usable', used: tab === 'used', sheet: s.open != null, sTitle: cur[0], sAmount: cur[1], close: () => this.setState({ open: null }) };
    const dd = [['#1D52B8', '#1C2A4C'], ['#FF7A70', '#3A1E1E'], ['#A3A9BD', '#232838'], ['#A3A9BD', '#232838']];
    for (let i = 0; i < 4; i++) {
      out['open' + i] = i < 2 ? () => this.setState({ open: i }) : () => {};
      out['dc' + i] = dd[i][0];
      out['db' + i] = dd[i][1];
    }
    return out;
  }
}
