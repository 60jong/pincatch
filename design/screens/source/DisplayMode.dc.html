<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"system","options":["system","light","dark"]},"deviceDark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || this.props.mode || 'system';
    const dev = !!this.props.deviceDark;
    const dark = mode === 'dark' || (mode === 'system' && dev);
    const T = dark
      ? { page: '#11141D', card: '#1B2030', line: '#2A3044', ink: '#EEF1F8', l2: '#A3A9BD', l3: '#7C8399', l4: '#5F667C', soft: '#1C2A4C', blueText: '#7FA8FF', edge4: 'rgba(0,0,0,0.45)', off: '#4A5168' }
      : { page: '#FFFFFF', card: '#FFFFFF', line: '#E3E7EF', ink: '#1F2233', l2: '#5B6078', l3: '#8A8FA3', l4: '#AEB4C6', soft: '#E6EEFF', blueText: '#1D52B8', edge4: 'rgba(31,34,51,0.10)', off: '#C7C7CC' };
    const out = Object.assign({}, T);
    ['system', 'light', 'dark'].forEach((k) => {
      const on = k === mode;
      out[k + 'Aria'] = on ? 'true' : 'false';
      out[k + 'Ring'] = on ? '#2F6FE8' : 'transparent';
      out[k + 'RB'] = on ? 'none' : '2px solid ' + T.off;
      out[k + 'RBg'] = on ? '#2F6FE8' : 'transparent';
      out['pick_' + k] = () => this.setState({ mode: k });
    });
    out.backHref = dark ? 'MyPageDark.dc.html' : 'MyPage.dc.html';
    out.noteTitle = mode === 'system' ? '휴대폰 설정을 따라가요' : mode === 'dark' ? '항상 어두운 화면' : '항상 밝은 화면';
    out.noteBody = mode === 'system'
      ? '지금 휴대폰이 ' + (dev ? '다크' : '라이트') + ' 모드라 ' + (dev ? '어둡게' : '밝게') + ' 보여요. 휴대폰 설정이 바뀌면 catch pin도 함께 바뀌어요.'
      : mode === 'dark' ? '밤에 핀을 찾을 때 눈이 편해요. 휴대폰 설정과 상관없이 어둡게 보여요.' : '낮에 밖에서 보기 좋아요. 휴대폰 설정과 상관없이 밝게 보여요.';
    return out;
  }
}
</script>
