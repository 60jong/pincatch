<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || "photo";
    const ph = s.ph ?? 0, ch = s.ch ?? 0, bg = s.bg ?? 0;
    const zoom = s.zoom ?? 140;
    const BG = [["#2F6FE8", "#1D52B8"], ["#FFC21A", "#D99A00"], ["#3FBF6B", "#2E9E55"], ["#E8534A", "#B33B33"], ["#5B4FC8", "#433A9E"], ["#1F2233", "#000000"]];
    const out = {
      isPhoto: tab === 'photo', isChar: tab === 'char',
      zoom: (zoom / 100).toFixed(2), zoomVal: zoom, zoomText: (zoom / 100).toFixed(1) + '배',
      panX: 0,
      hint: tab === 'photo' ? '원 안에 들어오는 부분만 보여요 · 끌어서 위치를 옮겨요' : '캐릭터와 배경색을 골라보세요',
      onZoom: (e) => this.setState({ zoom: Number(e.target.value) }),
      zoomIn: () => this.setState({ zoom: Math.min(250, zoom + 15) }),
      zoomOut: () => this.setState({ zoom: Math.max(100, zoom - 15) }),
      bgColor: BG[bg][0], bgEdge: BG[bg][1],
      tabs: [['photo', '내 사진'], ['char', '캐릭터']].map((t) => {
        const on = t[0] === tab;
        return { label: t[1], sel: on ? 'true' : 'false', bg: on ? '#2A3044' : 'transparent', sh: on ? '0 3px 0 #2A3044' : 'none', color: on ? '#EEF1F8' : '#A3A9BD', pick: () => this.setState({ tab: t[0] }) };
      })
    };
    for (let i = 0; i < 4; i++) {
      out['ph' + i] = i === ph ? 'block' : 'none';
      out['pp' + i] = i === ph ? 'true' : 'false';
      out['pb' + i] = i === ph ? '#2F6FE8' : 'transparent';
      out['pickPh' + i] = () => this.setState({ ph: i, zoom: 140 });
    }
    for (let i = 0; i < 8; i++) {
      out['ch' + i] = i === ch ? 'flex' : 'none';
      out['cp' + i] = i === ch ? 'true' : 'false';
      out['cb' + i] = i === ch ? '#EEF1F8' : '#FFFFFF';
      out['pickCh' + i] = () => this.setState({ ch: i });
    }
    for (let i = 0; i < 6; i++) {
      out['sp' + i] = i === bg ? 'true' : 'false';
      out['sb' + i] = i === bg ? '#EEF1F8' : '#FFFFFF';
      out['pickBg' + i] = () => this.setState({ bg: i });
    }
    return out;
  }
}
</script>
