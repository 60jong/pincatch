<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch pin · 회원 탈퇴 · 다크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{margin:0;background:#11141D}
a{color:#EEF1F8;text-decoration:none}a:hover{color:#EEF1F8}
input::placeholder{color:#7C8399}

.scroll-col>*{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; background: #1B2030; font-family: 'Gothic A1', system-ui, sans-serif; color: #EEF1F8; display: flex; flex-direction: column">
<div class="scroll-col" style="flex-grow: 1; overflow-y: auto; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin: -6px -10px 0"><a href="AccountDark.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5F667C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="font-size: 17px; font-weight: 900">회원 탈퇴</div><div style="min-width: 44px; display: flex; justify-content: flex-end"></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1.3">정말 떠나시나요?</h1><div style="font-size: 15px; color: #A3A9BD; font-weight: 700; line-height: 1.5">탈퇴하면 아래 내용이 모두 사라지고 되돌릴 수 없어요</div></div>
<div style="background: #3F1E18; border: 2px solid #FFD6D0; border-bottom-width: 4px; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: #3F3618; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B78700" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></div><div style="flex-grow: 1; font-size: 15px; font-weight: 700">보유 포인트</div><div style="font-family: 'Sora', 'Gothic A1', sans-serif; font-size: 15px; font-weight: 800; color: #FF7A70">12,480P</div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: #1C2A4C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6FE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="2"></rect><path d="M3 9h18M12 9v11M12 9S10.5 4 8 4.5 7.5 9 12 9zM12 9s1.5-5 4-4.5S16.5 9 12 9z"></path></svg></div><div style="flex-grow: 1; font-size: 15px; font-weight: 700">사용 가능한 쿠폰</div><div style="font-family: 'Sora', 'Gothic A1', sans-serif; font-size: 15px; font-weight: 800; color: #FF7A70">2장</div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: #232838; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A9BD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div><div style="flex-grow: 1; font-size: 15px; font-weight: 700">획득 기록과 통계</div><div style="font-family: 'Sora', 'Gothic A1', sans-serif; font-size: 15px; font-weight: 800; color: #FF7A70">전부</div></div>
</div>
<a href="WalletDark.dc.html" style="display: flex; align-items: center; gap: 10px; background: #161A26; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 700; color: #B2B6C7"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D52B8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path><path d="M16 14.5h2"></path></svg><span style="flex-grow: 1">떠나기 전에 포인트를 상품권으로 바꿔보세요</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D52B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
<div style="font-size: 13px; font-weight: 900; color: #A3A9BD; padding: 0 4px; margin-bottom: -10px">떠나는 이유를 알려주세요 (선택)</div>
<div style="background: #1B2030; border: 2px solid #2A3044; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; overflow: hidden">
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="4"><div role="radio" aria-checked="{{ r.sel }}" onClick="{{ r.pick }}" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 50px; cursor: pointer"><div style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{ r.border }}; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 50%; background: {{ r.dot }}"></div></div><div style="font-size: 15px; font-weight: 700">{{ r.label }}</div><div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ r.sep }}; background: #2A3044"></div></div></sc-for>
</div>
</div>
<div style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #2A3044">
<div role="checkbox" aria-checked="{{ okAria }}" onClick="{{ toggleOk }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer"><div style="width: 24px; height: 24px; border-radius: 7px; box-sizing: border-box; border: 2px solid {{ okBorder }}; background: {{ okBg }}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div><div style="font-size: 14px; font-weight: 700">위 내용을 확인했고, 탈퇴에 동의해요</div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><a href="MyPageDark.dc.html" style="min-height: 54px; border-radius: 16px; box-sizing: border-box; background: #1B2030; border: 2px solid #2A3044; border-bottom-width: 4px; color: #7FA8FF; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px">계속 쓸게요</a>
<sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}"><a href="LoginDark.dc.html" style="min-height: 54px; border-radius: 16px; background: #E8534A; box-shadow: 0 4px 0 #B33B33; color: #FFFFFF; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center">탈퇴하기</a></sc-if>
<sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}"><div aria-disabled="true" style="min-height: 54px; border-radius: 16px; box-sizing: border-box; background: #2A3044; box-shadow: 0 4px 0 #20263A; color: #7C8399; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px">탈퇴하기</div></sc-if></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const list = ["자주 쓰지 않아요", "핀이 잘 안 나타나요", "포인트 모으기가 어려워요", "기타"];
    const reasons = list.map((t, i) => {
      const on = s.reason === i;
      return { label: t, sel: on ? 'true' : 'false', border: on ? '2px solid #2F6FE8' : '2px solid #3A4157', dot: on ? '#2F6FE8' : 'transparent', sep: i === list.length - 1 ? '0px' : '2px', pick: () => this.setState({ reason: i }) };
    });
    const ok = !!s.ok;
    return { reasons: reasons, ok: ok, notOk: !ok, okAria: ok ? 'true' : 'false', okBorder: ok ? '#E8534A' : '#3A4157', okBg: ok ? '#E8534A' : '#FFFFFF', toggleOk: () => this.setState({ ok: !ok }) };
  }
}
</script>
</body>
</html>
