<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch pin · 프로필 편집</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F2233;text-decoration:none}a:hover{color:#1F2233}
input::placeholder{color:#8A8FA3}

</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Gothic A1', system-ui, sans-serif; color: #1F2233; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<a href="MyPage.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 17px; color: #2F6FE8">취소</a>
<div style="font-size: 17px; font-weight: 600">프로필 편집</div>
<sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}"><a href="MyPage.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 17px; font-weight: 600; color: #2F6FE8">완료</a></sc-if>
<sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}"><div aria-disabled="true" style="min-height: 44px; display: flex; align-items: center; font-size: 17px; font-weight: 600; color: #C7C7CC">완료</div></sc-if>
</div>
<div role="button" aria-label="프로필 사진 변경" onClick="{{ openSheet }}" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer"><div style="width: 104px; height: 104px; border-radius: 50%; border: 4px solid #1F2233; box-shadow: 0 4px 0 #000000; box-sizing: border-box; overflow: hidden; background: #FFFFFF; flex-shrink: 0"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; overflow: hidden; background: #D7E6FA"><svg width="100%" height="100%" viewBox="0 0 48 48" aria-hidden="true" style="display: block"><rect width="48" height="48" fill="#D7E6FA"></rect><circle cx="24" cy="19" r="9" fill="#8FA9CF"></circle><path d="M6 48c1-10 8-16 18-16s17 6 18 16z" fill="#8FA9CF"></path></svg></div></div><div style="font-size: 16px; color: #2F6FE8">사진 편집</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; color: #5B6078; padding: 0 16px">닉네임</div>
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 52px; box-shadow: 0 0 0 {{ ring }}"><input type="text" value="{{ nick }}" onChange="{{ onNick }}" maxlength="12" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #1F2233"><span style="font-size: 15px; color: #8A8FA3; font-variant-numeric: tabular-nums">{{ count }}/12</span></div>
<div style="font-size: 13px; color: {{ helpColor }}; padding: 0 16px">{{ help }}</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; color: #5B6078; padding: 0 16px">연결된 계정</div>
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px 16px"><div style="width: 30px; height: 30px; border-radius: 8px; background: #FEE500"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><div style="font-size: 16px">카카오</div><div style="font-size: 13px; color: #5B6078">hunter@kakao.com</div></div><span style="font-size: 15px; color: #5B6078">연결됨</span></div></div>
<sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
<div role="button" aria-label="닫기" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; background: rgba(15,22,48,0.5); z-index: 5"></div>
<div role="dialog" aria-label="프로필 사진" style="position: absolute; left: 12px; right: 12px; bottom: 24px; z-index: 6; display: flex; flex-direction: column; gap: 10px">
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; overflow: hidden">
<div style="position: relative; padding: 14px; text-align: center; font-size: 13px; font-weight: 700; color: #5B6078">프로필 사진<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #E3E7EF"></span></div>
<a href="PhotoEdit.dc.html" style="position: relative; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #1D52B8; cursor: pointer">사진 찍기<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #E3E7EF"></span></a><a href="PhotoEdit.dc.html" style="position: relative; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #1D52B8; cursor: pointer">앨범에서 선택<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #E3E7EF"></span></a><a href="PhotoCharacter.dc.html" style="position: relative; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #1D52B8; cursor: pointer">캐릭터로 바꾸기<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #E3E7EF"></span></a><div role="button" onClick="{{ closeSheet }}" style="position: relative; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #C73A31; cursor: pointer">기본 이미지로 변경</div>
</div>
<div style="background: #FFFFFF; border: 2px solid #E3E7EF; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; overflow: hidden"><div role="button" onClick="{{ closeSheet }}" style="position: relative; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #5B6078; cursor: pointer">취소</div></div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const orig = '빠른손가락';
    const nick = s.nick ?? orig;
    const len = Array.from(nick).length;
    const bad = /[^0-9A-Za-z가-힣]/.test(nick);
    let help = '한글, 영문, 숫자로 2~12자';
    let helpColor = '#5B6078';
    let ring = '0 transparent';
    let ok = false;
    if (len > 0) {
      if (len < 2) { help = '2자 이상 입력해 주세요'; helpColor = '#C73A31'; ring = '1.5px #E8534A'; }
      else if (bad) { help = '특수문자와 띄어쓰기는 쓸 수 없어요'; helpColor = '#C73A31'; ring = '1.5px #E8534A'; }
      else { help = '사용할 수 있는 닉네임이에요'; helpColor = '#1F8A3E'; ring = '1.5px #3FBF6B'; ok = true; }
    }
    if (nick === orig) { ok = false; ring = '0 transparent'; help = '한글, 영문, 숫자로 2~12자'; helpColor = '#5B6078'; }
    return { nick: nick, count: len, help: help, helpColor: helpColor, ring: ring, ok: ok, notOk: !ok,
      onNick: (e) => this.setState({ nick: e.target.value }),
      sheet: !!s.sheet, openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }) };
  }
}
</script>
</body>
</html>
