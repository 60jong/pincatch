<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch pin · 알림센터 · 다크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{margin:0;background:#11141D}
a{color:#EEF1F8;text-decoration:none}a:hover{color:#EEF1F8}
input::placeholder{color:#7C8399}

.scroll-col>*{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; background: #1B2030; font-family: 'Gothic A1', system-ui, sans-serif; color: #EEF1F8; display: flex; flex-direction: column">
<div style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; margin: 0 -6px"><a href="HomeGlassDark.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6FE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div role="button" onClick="{{ readAll }}" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; font-size: 17px; color: {{ readAllColor }}; cursor: pointer">모두 읽음</div></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -1px">알림</h1>
<sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><div style="font-size: 13px; font-weight: 600; color: #FFFFFF; background: #E8534A; border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums">{{ unreadCount }}</div></sc-if></div>
<div role="tablist" style="background: #161A26; border: 2px solid #2A3044; border-radius: 14px; padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><div role="tab" aria-selected="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 34px; border-radius: 10px; background: {{ f.bg }}; box-shadow: {{ f.sh }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: {{ f.fw }}; cursor: pointer">{{ f.label }}</div></sc-for>
</div></div>
<div class="scroll-col" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; color: #A3A9BD; padding: 0 16px">{{ g.label }}</div>
<div style="background: #1B2030; border: 2px solid #2A3044; border-bottom-width: 4px; border-radius: 20px; box-sizing: border-box; overflow: hidden">
<sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
<div role="button" onClick="{{ n.read }}" style="position: relative; display: flex; gap: 12px; padding: 12px 16px 12px 18px; cursor: pointer">
<sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><div aria-label="읽지 않음" style="position: absolute; left: 6px; top: 26px; width: 8px; height: 8px; border-radius: 50%; background: #2F6FE8"></div></sc-if>
<sc-if value="{{ n.isGold }}" hint-placeholder-val="{{ true }}"><div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,204,0,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B78700" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></div></sc-if><sc-if value="{{ n.isWin }}" hint-placeholder-val="{{ false }}"><div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(52,199,89,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FD07D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div></sc-if><sc-if value="{{ n.isInfo }}" hint-placeholder-val="{{ false }}"><div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(47,111,232,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6FE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3.5a2.5 2.5 0 0 0 0-5z"></path><path d="M14.5 5v14" stroke-dasharray="2 2.5"></path></svg></div></sc-if><sc-if value="{{ n.isNotice }}" hint-placeholder-val="{{ false }}"><div style="width: 40px; height: 40px; border-radius: 50%; background: #252A32; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A9BD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h3l9-5v14l-9-5H4z"></path><path d="M7 14v5h3"></path></svg></div></sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 8px"><div style="flex-grow: 1; font-size: 16px; font-weight: {{ n.fw }}">{{ n.title }}</div><div style="font-size: 13px; color: #A3A9BD; flex-shrink: 0">{{ n.time }}</div></div>
<div style="font-size: 14px; color: #A3A9BD; line-height: 1.4">{{ n.body }}</div></div>
<div style="position: absolute; left: 70px; right: 0; bottom: 0; height: {{ n.sepH }}; background: #2A3044"></div>
</div>
</sc-for></div></div>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding: 80px 20px; text-align: center; font-size: 16px; color: #A3A9BD">새 알림이 없어요</div></sc-if>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const filter = s.filter || 'all';
    const read = s.read || {};
    const all = [
      { id: 1, g: '오늘', type: 'gold', title: '근처에 골드 핀 등장', body: '100P 골드 핀이 나타났어요. 가장 먼저 잡아보세요', time: '방금', unread: true },
      { id: 2, g: '오늘', type: 'ticket', title: '탭권이 가득 찼어요', body: '무료 탭권이 5장 모두 충전됐어요. 지금 핀을 잡으러 가볼까요?', time: '25분 전', unread: true },
      { id: 3, g: '오늘', type: 'event', title: '주말 골드 핀 2배 이벤트', body: '토·일요일에는 골드 핀이 두 배로 자주 나타나요', time: '2시간 전', unread: true },
      { id: 4, g: '어제', type: 'exchange', title: '상품권 교환 완료', body: '편의점 모바일 상품권 5,000원이 도착했어요. 지갑에서 확인하세요', time: '21:40', unread: false },
      { id: 5, g: '어제', type: 'event', title: '친구 초대 보상 지급', body: '초대한 친구가 가입해서 500P를 받았어요', time: '15:02', unread: false },
      { id: 6, g: '어제', type: 'notice', title: '서비스 점검 안내', body: '9월 30일 새벽 2시부터 4시까지 점검이 있어요', time: '09:00', unread: false }
    ];
    const cats = { all: null, pin: ['gold', 'ticket'], perk: ['event', 'exchange'], notice: ['notice'] };
    const keep = (n) => !cats[filter] || cats[filter].indexOf(n.type) >= 0;
    const isUnread = (n) => n.unread && !read[n.id] && !s.allRead;
    const unreadCount = all.filter(isUnread).length;
    const groups = ['오늘', '어제'].map((label) => {
      const list = all.filter((n) => n.g === label && keep(n));
      return { label: label, items: list.map((n, i) => ({
        title: n.title, body: n.body, time: n.time,
        isGold: n.type === 'gold' || n.type === 'event', isWin: n.type === 'exchange', isInfo: n.type === 'ticket', isNotice: n.type === 'notice',
        unread: isUnread(n), fw: isUnread(n) ? 600 : 400,
        sepH: i === list.length - 1 ? '0px' : '0.5px',
        read: () => this.setState({ read: Object.assign({}, read, { [n.id]: true }) })
      })) };
    }).filter((g) => g.items.length);
    const filters = [['all', '전체'], ['pin', '핀'], ['perk', '혜택'], ['notice', '공지']].map((d) => {
      const on = d[0] === filter;
      return { label: d[1], on: on ? 'true' : 'false', bg: on ? '#2A3044' : 'transparent', sh: on ? '0 3px 0 #2A3044' : 'none', fw: on ? 900 : 700, pick: () => this.setState({ filter: d[0] }) };
    });
    return { groups: groups, filters: filters, empty: groups.length === 0, unreadCount: unreadCount, hasUnread: unreadCount > 0, readAllColor: unreadCount > 0 ? '#1D52B8' : '#5F667C', readAll: () => this.setState({ allRead: true }) };
  }
}
</script>
</body>
</html>
